name: Workflow tests
on:
  pull_request:
  push:
    branches: ['codex/flux-iugn-*']
permissions:
  contents: read
jobs:
  windows-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -W error::ResourceWarning -m unittest tests.test_iugn_ui tests.test_company tests.test_company_ui tests.test_iugn_contract tests.test_iugn_documents tests.test_iugn_contract_ui tests.test_local_pg_config
  sqlite-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m tests.test_core_workflow
      - run: python -m unittest tests.test_iugn tests.test_iugn_ui tests.test_permissions tests.test_access_ui tests.test_work_conflict_ui tests.test_lucrari_report_ui tests.test_backup_restore_helpers tests.test_company tests.test_company_ui tests.test_iugn_contract tests.test_iugn_documents tests.test_iugn_contract_ui tests.test_local_pg_config
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecoloptim_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: ecoloptim_pg_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecoloptim_ci -d ecoloptim_pg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate isolated PostgreSQL setup
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          from tools import local_pg_config as cfg, setup_postgres_test as setup
          with TemporaryDirectory() as directory:
              config_path = Path(directory) / 'isolated.json'
              with patch.object(cfg, 'CONFIG', config_path), patch.object(setup, 'CONFIG', config_path):
                  with patch('builtins.input', side_effect=['5432', 'ecoloptim_ci']):
                      with patch('getpass.getpass', side_effect=['disposable-ci-only', 'Test-app-password-123', 'Test-app-password-123']):
                          setup.main('ecoloptim_isolated_ci_test')
                  loaded = cfg.load_config()
                  assert loaded['TEST_DATABASE'] == 'ecoloptim_isolated_ci_test'
                  assert loaded['DATABASE_URL'].endswith('/ecoloptim_isolated_ci_test')
          PY
      - name: Configure disposable PostgreSQL only
        run: |
          python - <<'PY'
          from tools.local_pg_config import write_config
          write_config({'DATABASE_URL': 'postgresql://ecoloptim_ci:disposable-ci-only@127.0.0.1:5432/ecoloptim_pg_test'})
          PY
      - run: python -m tests.test_postgres
